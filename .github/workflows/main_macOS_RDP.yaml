name: CI MacOS

on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-11
    defaults:
      run:
        shell: bash

    steps:
    - name: Connect to Tailscale
      uses: tailscale/github-action@v3
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:ci
        version: latest
        use-cache: 'true'

    - name: Configure VNC
      env:
        PASSWORD: ${{ secrets.PASSWORD }}
      run: |
        # Disable spotlight indexing
        sudo mdutil -i off -a
        # Create new account
        sudo dscl . -create /Users/runneradmin
        sudo dscl . -create /Users/runneradmin UserShell /bin/bash
        sudo dscl . -create /Users/runneradmin RealName "Runner Admin"
        sudo dscl . -create /Users/runneradmin UniqueID 1001
        sudo dscl . -create /Users/runneradmin PrimaryGroupID 80
        sudo dscl . -create /Users/runneradmin NFSHomeDirectory /Users/runneradmin
        if [ -z "$PASSWORD" ]; then
          echo "PASSWORD is not set" >&2
          exit 1
        fi
        sudo dscl . -passwd /Users/runneradmin "$PASSWORD"
        sudo createhomedir -c -u runneradmin > /dev/null
        # Enable VNC
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -allowAccessFor -allUsers -privs -all
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -clientopts -setvnclegacy -vnclegacy yes
        # Set VNC password
        echo "$PASSWORD" | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; $_ = <>; chomp; s/^(.{8}).*/$1/; @p = unpack "C*", $_; foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }; print "\n"' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt
        # Start VNC/reset changes
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent -console
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate

    - name: Output Tailscale Connection Details
      env:
        PASSWORD: ${{ secrets.PASSWORD }}
      run: |
        if ! command -v tailscale >/dev/null 2>&1; then
          echo "Tailscale executable not found in PATH" >&2
          exit 1
        fi
        tailscale_ip=$(tailscale ip --4)
        if [ -z "$tailscale_ip" ]; then
          echo "Failed to retrieve Tailscale IP, connection may not be established" >&2
          exit 1
        fi
        tailscale_status=$(tailscale status)
        echo "Tailscale status: $tailscale_status"
        echo "VNC Connection: $tailscale_ip:5900"
        echo "Username: runneradmin"
        echo "Password: (use PASSWORD from secrets)"
        echo "VNC Access: Use the above IP and port in a VNC client"

    - name: Keep Workflow Running
      run: sleep 21600